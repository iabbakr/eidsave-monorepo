kind = "mobile"
previewPath = "/"
title = "EidSave"
version = "1.0.0"
id = "artifacts/eidsave"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20299

[services.development]
run = "pnpm --filter @workspace/eidsave run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eidsave", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/eidsave", "run", "serve" ]

[services.env]
PORT = "20299"
BASE_PATH = "/"
